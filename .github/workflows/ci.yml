name: MaintenX CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docker:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

  backend-ci:
    name: Backend Build & Tests (.NET 10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: maintenx_ci_admin_secret_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision restricted application role in PostgreSQL
        run: |
          docker exec $(docker ps -q --filter ancestor=postgres:16-alpine) psql -U postgres -d postgres -c "CREATE ROLE maintenx_app WITH LOGIN PASSWORD 'maintenx_ci_app_secret_pass' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          docker exec $(docker ps -q --filter ancestor=postgres:16-alpine) psql -U postgres -d postgres -c "CREATE DATABASE maintenx_dev OWNER maintenx_app;"
          docker exec $(docker ps -q --filter ancestor=postgres:16-alpine) psql -U postgres -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE maintenx_dev TO maintenx_app;"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MaintenX.sln

      - name: Build Solution (.NET 10 LTS)
        run: dotnet build MaintenX.sln --no-restore -c Release

      - name: Run Unit Tests
        run: dotnet test tests/unit/MaintenX.UnitTests.csproj --no-build -c Release --logger "trx;LogFileName=unit-tests.trx"

      - name: Run Integration Tests (PostgreSQL)
        run: dotnet test tests/integration/MaintenX.IntegrationTests.csproj --no-build -c Release --logger "trx;LogFileName=integration-tests.trx"
        env:
          ConnectionStrings__AdminConnection: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=maintenx_ci_admin_secret_pass;"
          ConnectionStrings__TestConnection: "Host=localhost;Port=5432;Database=postgres;Username=maintenx_app;Password=maintenx_ci_app_secret_pass;"
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=maintenx_dev;Username=maintenx_app;Password=maintenx_ci_app_secret_pass;"
          TestDatabase__AllowProvisioning: "true"
          TestDatabase__AllowedHosts: "localhost;127.0.0.1;postgres"

  frontend-ci:
    name: Frontend Lint & Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Next.js Lint
        working-directory: apps/web
        run: pnpm run lint

      - name: Next.js Production Build
        working-directory: apps/web
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  flutter-ci:
    name: Flutter Lint & Tests (Mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Flutter Widget Tests
        working-directory: apps/mobile
        run: flutter test
