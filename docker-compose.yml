services:
  postgres:
    image: postgres:16-alpine
    container_name: maintenx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maintenx_dev}
      POSTGRES_USER: ${POSTGRES_USER:-maintenx_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maintenx_dev_password_change_in_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maintenx_app} -d ${POSTGRES_DB:-maintenx_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - maintenx-network

networks:
  maintenx-network:
    name: maintenx-network
    driver: bridge

volumes:
  postgres_data:
    name: maintenx-postgres-data
